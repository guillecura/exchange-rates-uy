name = "exchange-rates"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# npx wrangler d1 create exchange-rates   → paste its database_id here
[[d1_databases]]
binding = "DB"
database_name = "exchange-rates"
database_id = "REPLACE-WITH-YOUR-DATABASE-ID"

# Only wakes it: the schedule decides what is read.
[triggers]
crons = ["*/15 * * * *"]

# The panel: npx wrangler secret put ADMIN_TOKEN
